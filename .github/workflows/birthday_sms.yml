name: Birthday WhatsApp

on:
  schedule:
    # 6 AM SAST = 4 AM UTC (SAST is UTC+2)
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      test_phone:
        description: "Phone number to send a test message to (E.164 format, e.g. +27810331882). Leave blank for normal run."
        required: false
        default: ""

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  send-birthday-whatsapp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install PyJWT requests twilio

      - name: Run birthday WhatsApp script
        env:
          LOOPY_API_KEY: ${{ secrets.LOOPY_API_KEY }}
          LOOPY_API_SECRET: ${{ secrets.LOOPY_API_SECRET }}
          LOOPY_CAMPAIGN_ID: ${{ secrets.LOOPY_CAMPAIGN_ID }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_NUMBER: ${{ secrets.TWILIO_WHATSAPP_NUMBER }}
          TWILIO_CONTENT_SID: ${{ secrets.TWILIO_CONTENT_SID }}
          TEST_PHONE: ${{ inputs.test_phone }}
        run: python birthday_sms.py
